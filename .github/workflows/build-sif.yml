name: Build PBS client SIF

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  APPTAINER_VERSION: 1.5.3
  APPTAINER_DEB_SHA256: 82b0bdddf459087d202383360b8318d526ad6826c748a2f669913cc6aef9ee40

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      release_tag: ${{ steps.build.outputs.release_tag }}
      sif_name: ${{ steps.build.outputs.sif_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Apptainer
        run: |
          set -euo pipefail
          package="apptainer_${APPTAINER_VERSION}_amd64.deb"
          url="https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/${package}"

          curl --fail --silent --show-error --location "$url" --output "$package"
          echo "${APPTAINER_DEB_SHA256}  ${package}" | sha256sum --check --strict -
          sudo apt-get update
          sudo apt-get install -y "./${package}" debootstrap debian-archive-keyring
          apptainer version

      - name: Build and inspect image
        id: build
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          short_sha=${GITHUB_SHA::12}
          build_version="sha-${short_sha}"
          release_tag=
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            release_tag=$(TZ=Europe/Prague date '+%Y.%m.%d-%H-%M')
            build_version="$release_tag"
          fi

          sudo apptainer build \
            --build-arg "BUILD_VERSION=${build_version}" \
            --build-arg "BUILD_REVISION=${GITHUB_SHA}" \
            debian-pbs-client.sif debian-pbs-client.def
          sudo chown "$(id -u):$(id -g)" debian-pbs-client.sif

          os_id=$(apptainer exec debian-pbs-client.sif sh -c '. /etc/os-release; printf %s "$ID"')
          os_version=$(apptainer exec debian-pbs-client.sif sh -c '. /etc/os-release; printf %s "$VERSION_ID"')
          architecture=$(apptainer exec debian-pbs-client.sif dpkg --print-architecture)
          client_version=$(apptainer exec debian-pbs-client.sif \
            dpkg-query -W -f='${Version}' proxmox-backup-client)

          [[ "$os_id" == "debian" ]]
          [[ "$os_version" == "12" ]]
          [[ "$architecture" == "amd64" ]]
          if [[ ! "$client_version" =~ ^3\. ]]; then
            echo "Expected proxmox-backup-client 3.x, got ${client_version}" >&2
            exit 1
          fi

          safe_version=${client_version//:/_}
          safe_version=${safe_version//+/_}
          sif_name="debian-pbs-client-${safe_version}-bookworm-amd64.sif"
          artifact_name="debian-pbs-client-${safe_version}-${short_sha}"
          mv debian-pbs-client.sif "$sif_name"

          apptainer run "$sif_name" version
          apptainer inspect --json "$sif_name" > image-inspect.json
          apptainer inspect --deffile "$sif_name" > embedded-definition.def
          apptainer exec "$sif_name" \
            dpkg-query -W -f='${binary:Package}\t${Version}\n' | sort > packages.tsv
          sha256sum "$sif_name" > "${sif_name}.sha256"

          {
            echo "build_version=${build_version}"
            echo "git_revision=${GITHUB_SHA}"
            echo "git_ref=${GITHUB_REF}"
            echo "built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "apptainer_version=$(apptainer version)"
            echo "debian_version=${os_version}"
            echo "architecture=${architecture}"
            echo "proxmox_backup_client_version=${client_version}"
          } > build-info.txt

          echo "sif_name=${sif_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.sif_name }}
            ${{ steps.build.outputs.sif_name }}.sha256
            build-info.txt
            packages.tsv
            image-inspect.json
            embedded-definition.def
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  attest:
    name: Attest image provenance
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Verify image checksum
        working-directory: dist
        run: sha256sum --check --strict "${{ needs.build.outputs.sif_name }}.sha256"

      - name: Attest image
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/${{ needs.build.outputs.sif_name }}

  release:
    name: Publish release
    if: ${{ inputs.publish_release }}
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Verify image checksum
        working-directory: dist
        run: sha256sum --check --strict "${{ needs.build.outputs.sif_name }}.sha256"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
